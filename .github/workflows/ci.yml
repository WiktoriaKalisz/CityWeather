name: CI Demo

on:
  push:
    branches: [main]

jobs:
  lint-test-build-e2e:
    runs-on: ubuntu-latest
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run JEST unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: http://localhost:3000
          browser: chrome
        env:
          NEXT_PUBLIC_USE_MOCKS: 1

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: lint-test-build-e2e
    if: github.ref == 'refs/heads/main'
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            --build-arg OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }} \
            -t weather:$IMAGE_TAG .
          docker tag weather:$IMAGE_TAG wiktoriakalisz/weather:$IMAGE_TAG

      - name: Push Docker image to DockerHub
        run: docker push wiktoriakalisz/weather:$IMAGE_TAG

      - name: List local images
        run: docker images
